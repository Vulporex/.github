name: Feature request
description: Propose a product or engineering improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or business need, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include measurable checks that define done.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Dependencies, risks, and constraints
